# Nginx reverse proxy config for production
# Optimized for low-memory environments (1 GB RAM)
# HTTP only — no SSL. Add SSL when you have a domain.
#
# This file is mounted as /etc/nginx/conf.d/default.conf, so it is included
# inside the main nginx.conf http block. Only server/location directives go here.
#
# To add SSL later:
# 1. Get a domain and point it to your server IP
# 2. Use Let's Encrypt to get a certificate
# 3. Replace this file with a full nginx.conf (not conf.d include)

server {
    listen 80;
    server_name _;

    # Minimal logging to save disk I/O
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API reverse proxy
    # /api/ is preserved in the path, so /api/v1/products → backend:8000/api/v1/products
    location /api/ {
        proxy_pass http://backend:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check (direct, no prefix)
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
