# PostgreSQL custom configuration for low-memory environments (1 GB RAM)
# This file is mounted into the PostgreSQL container to override default settings.
#
# Total memory budget for PostgreSQL: ~256 MB (container limit)
# shared_buffers: 25% of available memory
# effective_cache_size: 75% of available memory
# work_mem: per-operation memory, keep low to avoid OOM with concurrent queries

# Memory settings
shared_buffers = 32MB
effective_cache_size = 96MB
maintenance_work_mem = 16MB
work_mem = 4MB
huge_pages = off

# Connection settings
max_connections = 10

# WAL settings
wal_buffers = 2MB
min_wal_size = 80MB
max_wal_size = 512MB

# Checkpoint settings
checkpoint_completion_target = 0.9

# Query planner settings
random_page_cost = 1.1
effective_io_concurrency = 2

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
