# Casa Afeto — Production Docker Compose
# Services: PostgreSQL, Backend, Frontend, Nginx, Backup

services:
  db:
    image: postgres:16-alpine
    container_name: casa_afeto_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: casa_afeto_backend_prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: '${CORS_ORIGINS}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: casa_afeto_frontend_prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: casa_afeto_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal
      - external

  certbot:
    image: certbot/certbot
    container_name: casa_afeto_certbot
    profiles:
      - certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "certbot certonly --webroot --webroot-path=/var/www/certbot \
         --email ${CERTBOT_EMAIL} \
         -d ${NGINX_DOMAIN} \
         --agree-tos --non-interactive || true"
    networks:
      - external

  backup:
    image: postgres:16-alpine
    container_name: casa_afeto_backup
    restart: unless-stopped
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
    volumes:
      - backups:/backups
      - ./scripts/backup:/backup-scripts:ro
    entrypoint: ["/backup-scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  backups:
  certbot_data:
  certbot_webroot:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
